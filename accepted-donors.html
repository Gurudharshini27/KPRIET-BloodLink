<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Accepted Donors - BloodLink</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 30px;
        }

        h1 {
            color: #b71c1c;
            text-align: center;
        }

        #accepted-donors {
            max-width: 700px;
            margin: 25px auto;
        }

        .donor-card {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .donor-card h3 {
            color: #c62828;
            margin-top: 0;
        }

        .donor-card p {
            font-size: 16px;
            margin: 10px 0;
        }

        .donor-card a {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 15px;
            background-color: #2e7d32;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .donor-card a:hover {
            background-color: #1b5e20;
        }
    </style>
</head>

<body>

    <h1>🩸 Accepted Donors</h1>

    <div id="accepted-donors">
        <p>Loading accepted donors...</p>
    </div>

    <script type="module" src="js/accepted-donors.js"></script>

</body>

</html>
